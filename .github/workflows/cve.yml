name: CVE Scanning

permissions:
  contents: read

on:
  push:
    branches: ['main', 'release/**']
  pull_request:
    branches: ['main', 'release/**']
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC

jobs:
  grype:
    name: Grype dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          cache-db: true

      - name: Scan (table)
        run: |
          ${{ steps.grype.outputs.cmd }} dir:. \
            --config .github/security/grype.yaml \
            --output template

      - name: Scan (SARIF)
        if: ${{ always() }}
        run: |
          ${{ steps.grype.outputs.cmd }} dir:. \
            --config .github/security/grype.yaml \
            --output sarif --file grype-results.sarif || true

      - name: Upload SARIF report
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: grype-results.sarif
