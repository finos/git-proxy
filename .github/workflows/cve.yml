name: CVE Scanning

permissions:
  contents: read

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC

jobs:
  grype:
    name: Grype dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          cache-db: true

      - name: Scan (table)
        run: |
          ${{ steps.grype.outputs.cmd }} dir:. \
            --config .grype.yaml \
            --output template

      - name: Scan (SARIF)
        if: ${{ always() }}
        run: |
          ${{ steps.grype.outputs.cmd }} dir:. \
            --config .grype.yaml \
            --output sarif --file grype-results.sarif || true

      - name: Upload SARIF report
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: grype-results.sarif
