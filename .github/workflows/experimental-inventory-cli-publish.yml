name: experimental-inventory-cli - Publish to NPM
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'release version without v prefix'
        required: true
        type: string
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: check version matches input
        run: |
          grep "\"version\": \"${{ github.event.inputs.version }}\"," package.json
        working-directory: ./experimental/li-cli

      - run: npm ci
        working-directory: ./experimental/li-cli

      - run: npm run build
        working-directory: ./experimental/li-cli

      - run: npm publish --access=public
        working-directory: ./experimental/li-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
