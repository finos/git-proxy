name: Code Cleanliness

on: [pull_request, merge_group]

env:
  NODE_VERSION: 22

permissions:
  contents: read

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps: # list of steps
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Install NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          npm i -g npm@11
          npm ci

      - name: Code Linting
        run: |
          npm run lint
          npm run lint --workspaces --if-present

      - name: Check formatting
        run: npm run format:check

      - name: Check generated config types are up-to-date
        run: |
          npm run generate-config-types
          if ! git diff --exit-code src/config/generated/config.ts; then
            echo "Generated config types are out of date. Run 'npm run generate-config-types' locally and commit the changes."
            exit 1
          fi
