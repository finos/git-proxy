name: Publish to NPM
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build

      - name: Build git-proxy-cli workspace
        run: npm run build -w packages/git-proxy-cli

      - name: Verify git-proxy-cli is in lockstep with the root package
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          CLI_VERSION=$(node -p "require('./packages/git-proxy-cli/package.json').version")
          CLI_PIN=$(node -p "require('./packages/git-proxy-cli/package.json').dependencies['@finos/git-proxy']")
          if [[ "$CLI_VERSION" != "$ROOT_VERSION" ]]; then
            echo "Version mismatch: root=$ROOT_VERSION cli=$CLI_VERSION"
            exit 1
          fi
          if [[ "$CLI_PIN" != "$ROOT_VERSION" ]]; then
            echo "CLI pins @finos/git-proxy@$CLI_PIN but root is $ROOT_VERSION"
            exit 1
          fi

      - name: Smoke test package before publishing
        run: ./scripts/package-smoke-test.sh --no-clean-build

      - name: Determine dist-tag and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          echo "Publishing $PKG_NAME@$VERSION"

          # Build the publish command flags.
          PUBLISH_FLAGS=(--access=public)
          if [[ "$DRY_RUN" == "true" ]]; then
            PUBLISH_FLAGS+=(--dry-run)
            echo "DRY RUN — nothing will actually be published."
          fi

          # Pre-releases (ex: 2.1.0-rc.1) get tagged as 'rc'
          if [[ "$VERSION" == *"-"* ]]; then
            echo "Pre-release detected, publishing under 'rc' tag"
            npm publish "${PUBLISH_FLAGS[@]}" --tag rc
            exit 0
          fi

          # Look up current 'latest' on NPM. If never published before,
          # defaults to 0.0.0 so any release (0.1.0, 1.0.0, etc.) becomes latest
          CURRENT_LATEST=$(npm view "$PKG_NAME" version 2>/dev/null || echo "0.0.0")
          echo "Current 'latest' on npm: $CURRENT_LATEST"

          # If this version is strictly greater than the current 'latest',
          # it becomes latest
          if npx --yes semver "$VERSION" -r ">$CURRENT_LATEST" >/dev/null 2>&1; then
            echo "Publishing as 'latest'"
            npm publish "${PUBLISH_FLAGS[@]}"
          else
            # Otherwise, this is a maintenance release on an older line
            # Tag as v<major>.<minor> so users can pin to it
            MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
            DIST_TAG="release-${MAJOR_MINOR}"
            echo "Maintenance release detected, publishing under '$DIST_TAG' tag"
            npm publish "${PUBLISH_FLAGS[@]}" --tag "$DIST_TAG"
          fi

      - name: Check if pre-release and publish @finos/git-proxy-cli to NPM
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then
            echo "Publishing pre-release: $VERSION"
            npm publish -w packages/git-proxy-cli --access=public --tag rc
          else
            echo "Publishing stable release: $VERSION"
            npm publish -w packages/git-proxy-cli --access=public
          fi
