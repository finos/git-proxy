name: Publish to NPM
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build

      - name: Build git-proxy-cli workspace
        run: npm run build -w packages/git-proxy-cli

      - name: Verify git-proxy-cli is in lockstep with the root package
        run: node scripts/release/versions.mjs check

      - name: Smoke test package before publishing
        run: ./scripts/package-smoke-test.sh --no-clean-build

      - name: Determine dist-tag and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          CLI_NAME=$(node -p "require('./packages/git-proxy-cli/package.json').name")

          # Build the publish command flags.
          PUBLISH_FLAGS=(--access=public)
          if [[ "$DRY_RUN" == "true" ]]; then
            PUBLISH_FLAGS+=(--dry-run)
            echo "DRY RUN — nothing will actually be published."
          fi

          # Look up current 'latest' on NPM. If never published before,
          # defaults to 0.0.0 so any release (0.1.0, 1.0.0, etc.) becomes latest
          CURRENT_LATEST=$(npm view "$PKG_NAME" version 2>/dev/null || echo "0.0.0")
          echo "Current 'latest' on npm: $CURRENT_LATEST"

          # Pre-releases (ex: 2.1.0-rc.1) get 'rc', versions above the current
          # 'latest' become 'latest', and maintenance releases on an older line
          # get 'release-<major>.<minor>' so users can pin to it.
          # Both packages share a version (checked above), so they share a tag.
          DIST_TAG=$(node scripts/release/versions.mjs dist-tag "$VERSION" "$CURRENT_LATEST")
          echo "Publishing $PKG_NAME@$VERSION and $CLI_NAME@$VERSION under '$DIST_TAG'"

          # The CLI pins the root package at this exact version, so publish the root first
          npm publish "${PUBLISH_FLAGS[@]}" --tag "$DIST_TAG"
          npm publish "${PUBLISH_FLAGS[@]}" --tag "$DIST_TAG" -w packages/git-proxy-cli
