# This workflow builds the package and checks that the build is correct
# (includes the UI files)

name: Package Smoke Test

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  merge_group:

permissions:
  contents: read

jobs:
  smoke-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Build
        run: npm run build

      - name: Smoke test build
        run: bash ./scripts/package-smoke-test.sh --no-clean-build
