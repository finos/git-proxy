name: Release Drafter

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      # Required to create/update the draft release
      # Autolabeling runs in a separate workflow so this job only
      # needs to read merged PRs
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea
        with:
          # Target the branch that triggered this run
          # Ex: "release/2.1" becomes the commitish for the draft
          commitish: ${{ github.ref_name }}
          repository: ${{ github.repository }}
          config-name: release-drafter-config.yml
          filter-by-commitish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
