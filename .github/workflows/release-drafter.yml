name: Release Drafter

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      # Required to create/update the draft release
      # Autolabeling runs in a separate workflow so this job only
      # needs to read merged PRs
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0
        with:
          # Target the branch that triggered this run
          # Ex: "release/2.1" becomes the commitish for the draft
          commitish: ${{ github.ref_name }}
          repository: ${{ github.repository }}
          config-name: release-drafter-config.yml
          filter-by-commitish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
