name: git-proxy

services:
  git-proxy:
    build: ../..
    ports:
      - '8000:8000'
      - '8081:8081'
    command: ['node', 'dist/index.js', '--config', '/app/e2e.proxy.config.json']
    volumes:
      - ./proxy.config.json:/app/e2e.proxy.config.json:ro
      # If using Podman, you might need to add the :Z or :z option for SELinux
      # - ./proxy.config.json:/app/e2e.proxy.config.json:ro,Z
    depends_on:
      mongodb:
        condition: service_healthy
      git-server-seed:
        condition: service_completed_successfully
    networks:
      - git-network
    environment:
      - NODE_ENV=test
      - CONFIG_FILE=/app/e2e.proxy.config.json
      - GIT_PROXY_UI_PORT=8081
      - GIT_PROXY_SERVER_PORT=8000
      - NODE_OPTIONS=--trace-warnings
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      # Runtime environment variables for UI configuration
      # API_URL should point to the same origin as the UI (both on 8081)
      # Leave empty or unset for same-origin API access
      # - API_URL=
      # CORS configuration - controls which origins can access the API
      # Options:
      #   - '*' = Allow all origins (testing/development)
      #   - Comma-separated list = 'http://localhost:3000,https://example.com'
      #   - Unset/empty = Same-origin only (most secure)
      - ALLOWED_ORIGINS=
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8081/api/v1/healthcheck || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  mongodb:
    image: mongo:7@sha256:606f8e029603330411a7dd10b5ffd50eefc297fc80cee89f10a455e496a76ae7
    ports:
      - '27017:27017'
    networks:
      - git-network
    environment:
      - MONGO_INITDB_DATABASE=gitproxy
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Forgejo stands in for the upstream SCM: a real forge with a real identity API, which is what the
  # proxy's `forgejo` provider talks to. It serves HTTPS on 8443 with a self-signed certificate
  # because the proxy reconstructs upstream URLs as https://. Pulled from the project's own mirror
  # rather than codeberg.org.
  git-server:
    image: data.forgejo.org/forgejo/forgejo:16.0.5-rootless@sha256:bda6d9357909df2f315b921fb5b6da88fbfc1ca622698225e5a4b0a7a3b7b42c
    ports:
      - '8443:8443'
    hostname: git-server
    environment:
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__security__SECRET_KEY=e2e-only-not-a-secret
      - FORGEJO__server__PROTOCOL=https
      - FORGEJO__server__CERT_FILE=/var/lib/gitea/cert.pem
      - FORGEJO__server__KEY_FILE=/var/lib/gitea/key.pem
      - FORGEJO__server__HTTP_PORT=8443
      - FORGEJO__server__DOMAIN=git-server
      - FORGEJO__server__ROOT_URL=https://git-server:8443/
      - FORGEJO__server__DISABLE_SSH=true
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__repository__DEFAULT_BRANCH=main
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__log__LEVEL=Warn
    # Generate the certificate before the stock entrypoint starts the server.
    command:
      - sh
      - -c
      - |
        cd /var/lib/gitea && { [ -f cert.pem ] || forgejo cert --host git-server,localhost >/dev/null 2>&1; } \
          && exec /usr/local/bin/docker-entrypoint.sh
    volumes:
      - forgejo_data:/var/lib/gitea
    networks:
      - git-network
    healthcheck:
      test: ['CMD', 'curl', '-fsk', 'https://localhost:8443/api/healthz']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Creates the users, orgs and repos the suite expects, then exits. Idempotent, so it runs on every
  # `up` and a re-run against an existing volume is a no-op. Reuses the Forgejo image for its CLI and
  # curl, and shares the data volume so the CLI writes to the same database.
  git-server-seed:
    image: data.forgejo.org/forgejo/forgejo:16.0.5-rootless@sha256:bda6d9357909df2f315b921fb5b6da88fbfc1ca622698225e5a4b0a7a3b7b42c
    depends_on:
      git-server:
        condition: service_healthy
    volumes:
      - forgejo_data:/var/lib/gitea
      - ./forgejo/seed.sh:/seed.sh:ro
      # If using Podman, you might need to add the :Z or :z option for SELinux
      # - ./forgejo/seed.sh:/seed.sh:ro,Z
    entrypoint: ['/bin/sh', '/seed.sh']
    networks:
      - git-network
    restart: 'no'

networks:
  git-network:
    driver: bridge

volumes:
  mongodb_data:
  forgejo_data:
